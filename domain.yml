responses:
  utter_greet:
  - text: |-
      Hey! 👋 I'm BuddyBot, FCI's campus assistant at Sadat Academy.
      Ask me about students, GPA, courses, schedules, instructors,
      FCI policies, official documents, or any campus service.
      Arabic or English — your choice!
  utter_bot_status:
  - text: I'm good. I can help with FCI student profiles, GPA, courses, schedules, instructors, rooms, departments, campus-service
      questions, and normal study advice.
  - text: I'm here. We can chat normally, make a study plan, talk through stress, or check FCI university data.
  utter_bot_identity:
  - text: 'I''m BuddyBot, your campus buddy. I can chat, give student advice, show FCI student profiles, check GPA, list courses,
      find schedules, and answer campus-service questions. For example: ''tell me about student 2122136'', ''what is the AI
      schedule?'', ''list CS courses'', or ''help me make a study plan''.'
  utter_fci_qa_admission_requirements_admission_requirements_en_1c37b4:
  - text: 'According to the official FCI student guide Q&A: Students need the required secondary school score, 80% in English,
      aptitude test success, and personal interview approval.

      Source: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_admission_documents_documents_required_application_en_0db160:
  - text: 'According to the official FCI student guide Q&A: Secondary certificate, birth certificate, ID copy, photos, and
      medical checkup.

      Source: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_departments_departments_available_en_ca75cf:
  - text: 'According to the official FCI student guide Q&A: Computer Science, Information Systems, and Software Engineering.

      Source: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_specialization_specialization_begin_en_7a076e:
  - text: 'According to the official FCI student guide Q&A: Specialization begins in the third year.

      Source: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_attendance_maximum_allowed_absence_percentage_en_0e491c:
  - text: 'According to the official FCI student guide Q&A: 25% of total teaching hours.

      Source: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_guide_grades_distributed_en_f17d8a:
  - text: 'According to the official FCI student guide Q&A: 15% midterm, 60% final, 25% coursework.

      Source: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_admission_requirements_a83d7e85_ar_994a75:
  - text: 'حسب دليل كلية الحاسبات والمعلومات الرسمي: يجب تحقيق الحد الأدنى المطلوب و80٪ في اللغة الإنجليزية واجتياز الاختبارات
      والمقابلة الشخصية.

      المصدر: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_admission_documents_677cb02b_ar_3ccf19:
  - text: 'حسب دليل كلية الحاسبات والمعلومات الرسمي: شهادة الثانوية وشهادة الميلاد وصورة البطاقة والصور الشخصية والكشف الطبي.

      المصدر: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_departments_5cf7c8ae_ar_526316:
  - text: 'حسب دليل كلية الحاسبات والمعلومات الرسمي: علوم الحاسب ونظم المعلومات وهندسة البرمجيات.

      المصدر: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_specialization_248d0ef1_ar_b54f75:
  - text: 'حسب دليل كلية الحاسبات والمعلومات الرسمي: يبدأ التخصص في الفرقة الثالثة.

      المصدر: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_attendance_cd9a2926_ar_cd4e27:
  - text: 'حسب دليل كلية الحاسبات والمعلومات الرسمي: 25٪ من إجمالي ساعات المقرر.

      المصدر: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_grading_dd0f77e9_ar_36e871:
  - text: 'حسب دليل كلية الحاسبات والمعلومات الرسمي: 15٪ ميدترم و60٪ فاينال و25٪ أعمال سنة.

      المصدر: FCI_Bilingual_QA_Dataset (1).docx'
  utter_fci_qa_vision_vision_en_c6887d:
  - text: 'According to the official FCI student guide Q&A: FCI aspires to advance the scientific, applied, and research level
      in Computer Science, Information Systems, and Software Engineering, achieving a distinguished standing among FCI faculties
      locally, regionally, and globally, while upholding professional ethics, developing Egypt''s information society, and
      managing its information resources and heritage.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_mission_mission_en_0d17d2:
  - text: 'According to the official FCI student guide Q&A: The faculty strives to provide a distinguished educational and
      research level in CS, IS, and SE for its graduates, preparing them academically and professionally to meet society''s
      evolving aspirations, building the IT infrastructure of organizations, with attention to diversity in scientific research
      and development, and providing an environment that encourages creativity, excellence, and professional ethical commitment.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_goals_main_goals_list_all_en_555d93:
  - text: 'According to the official FCI student guide Q&A: 1) Prepare CS/IS specialists with theoretical and applied skills.
      2) Conduct scientific and applied research in CS, IS, SE. 3) Provide scientific and technical consultations. 4) Train
      technical staff in state sectors. 5) Raise societal awareness of computing technology. 6) Organize conferences and scientific
      meetings. 7) Sign scientific agreements with local, regional, and global institutions. 8) Support scientific publishing
      and research. 9) Establish advanced specialized research units.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_under_ministry_legal_framework_sadat_en_0ce8df:
  - text: 'According to the official FCI student guide Q&A: Sadat Academy for Management Sciences is a governmental educational
      body subject to Universities Organization Law No. 49 of 1972 and its amendments.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_departments_many_departments_have_they_en_e119a9:
  - text: 'According to the official FCI student guide Q&A: Three departments: (1) Computer Sciences, (2) Information Systems,
      (3) Software Engineering. Other departments may be created in the future per university organization law.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_degree_grant_en_aa8e18:
  - text: 'According to the official FCI student guide Q&A: A Bachelor''s degree in Computers and Information in one of three
      specializations: Computer Sciences, Information Systems, or Software Engineering.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_language_all_instruction_conducted_en_dee583:
  - text: 'According to the official FCI student guide Q&A: All instruction is conducted entirely in English.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_specialization_must_student_choose_their_major_en_cdf978:
  - text: 'According to the official FCI student guide Q&A: At the beginning of Year 3 (Level 3), when specialization begins.
      The major and minor specializations cannot be in the same field.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_departments_can_major_minor_specializations_same_en_875f93:
  - text: 'According to the official FCI student guide Q&A: No. The major and minor specializations must be in different fields.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_specialization_dual_specialization_bachelor_degree_can_en_a4db69:
  - text: 'According to the official FCI student guide Q&A: A student may earn a dual-specialization Bachelor''s degree by
      fulfilling all study requirements of both specializations offered by FCI. The Academy''s Scientific Council organizes
      the procedures for completing a dual specialization.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_specialization_many_times_can_student_change_en_38a3d3:
  - text: 'According to the official FCI student guide Q&A: Only once throughout the entire study period. Students in the
      final year may not change their specialization, and changes are subject to available seats.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_topics_covered_sciences_department_en_e76267:
  - text: 'According to the official FCI student guide Q&A: Algorithm Analysis & Design, Computer Architecture, Computer Programming,
      OOP, Web Application Development, Compiler & Interpreter Design, Logic Design, Data Structures, Operating Systems, AI,
      Intelligent Systems, NLP, Image Processing, Computer Graphics, Neural Networks, Machine Learning, Computer Security,
      HCI, Cloud Computing, Computer Vision, Pattern Recognition, Virtual Reality, and Graduation Project.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_focus_systems_department_en_a3998e:
  - text: 'According to the official FCI student guide Q&A: IS develops, operates, and maintains systems enabling information
      and communication services in modern organizations. It bridges Computer Science and the business world by understanding
      organizational problems and proposing technical solutions, drawing inputs from data, information, and knowledge.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_software_engineering_department_cover_en_337572:
  - text: 'According to the official FCI student guide Q&A: Developing software systems efficiently, reliably, and at scale
      with ongoing maintenance. It covers requirements specification and validation, software design and architecture, quality
      analysis, construction, testing, maintenance, software project management, and SE economics.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_specialization_request_must_made_change_specialization_en_1b5b85:
  - text: 'According to the official FCI student guide Q&A: Requests to change specialization are submitted to the Dean during
      the last two weeks of the semester. The decision must be made by the end of the first week of the following semester.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_secondary_school_streams_eligible_admission_en_438237:
  - text: 'According to the official FCI student guide Q&A: Mathematics stream and Science stream (or equivalent certificates
      recognized by the Academy).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_minimum_english_language_percentage_required_en_689175:
  - text: 'According to the official FCI student guide Q&A: At least 80% in the English language in the General Secondary
      Education certificate or its equivalent.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_tests_must_student_pass_admitted_en_a76e82:
  - text: 'According to the official FCI student guide Q&A: The student must pass the aptitude tests held by the faculty,
      and then pass the personal interview for those who succeed in the tests.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_admission_documents_list_all_required_documents_application_en_73addf:
  - text: 'According to the official FCI student guide Q&A: 1) Grade sheet from General Secondary Education or equivalent.
      2) Copy or official extract of birth certificate. 3) Copy of national ID card. 4) Medical examination by the Academy.
      5) Six personal photographs. 6) Any other requirements specified by the Academy''s admission policy. Male students must
      also submit military service forms (Form 2 Jund & 6 Jund, or Form 7 Jund).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_admission_documents_within_long_must_original_documents_en_835915:
  - text: 'According to the official FCI student guide Q&A: The student must submit all original documents (Secondary Certificate
      and Birth Certificate) within one week of enrollment at the faculty.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_steps_admission_process_en_a5004c:
  - text: 'According to the official FCI student guide Q&A: 1) Review submitted documents against originals. 2) Receive payment
      order for the application envelope fee. 3) Pay envelope and examination fees at the treasury. 4) Student fills in all
      data forms. 5) Submit file to the registration committee. 6) Receive file number (seat number). 7) Exam location and
      date announced only after file submission.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_transfer_transfer_conditions_from_equivalent_en_992d9a:
  - text: 'According to the official FCI student guide Q&A: The student must be passing at their current faculty, and their
      secondary school total must not fall below the minimum set by the Academy''s Scientific Council in the year they obtained
      their secondary certificate.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_transfer_transfer_conditions_from_non_equivalent_en_294276:
  - text: 'According to the official FCI student guide Q&A: The student must hold a secondary certificate total that qualifies
      for FCI admission in the year they obtained their certificate.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_can_student_was_permanently_expelled_en_56daa6:
  - text: 'According to the official FCI student guide Q&A: No. In all cases, the student must not have been permanently dismissed
      for disciplinary reasons from any faculty or scientific institute.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_transfer_must_transfer_student_have_had_en_5b6fd7:
  - text: 'According to the official FCI student guide Q&A: Yes. In all cases, the student must not have discontinued studies
      before the transfer to the faculty.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_graduation_many_total_credit_hours_required_en_8fec8b:
  - text: 'According to the official FCI student guide Q&A: 144 credit hours.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_144_credit_hours_distributed_across_en_9d85fd:
  - text: 'According to the official FCI student guide Q&A: General Requirements: 12 hrs (6 mandatory + 6 elective). College
      Requirements: 72 hrs (66 mandatory + 6 elective). Major Specialization: 45 hrs (30 mandatory + 15 elective). Minor Specialization:
      15 hrs (elective). Total: 144 hrs.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_graduation_many_years_semesters_bachelor_program_en_31cd45:
  - text: 'According to the official FCI student guide Q&A: 4 years divided into 8 semesters, plus summer practical training
      either inside or outside the faculty.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_long_each_academic_semester_en_88e911:
  - text: 'According to the official FCI student guide Q&A: 16 weeks.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_specialization_specialization_start_years_shared_all_en_e424a0:
  - text: 'According to the official FCI student guide Q&A: Study is general and shared for all students through the end of
      Year 2. Major specialization begins at the start of Year 3 (covering the four semesters of Years 3 and 4).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_study_system_credit_hour_ranges_define_each_en_b517af:
  - text: 'According to the official FCI student guide Q&A: Level 1: 1–36 hrs completed. Level 2: 37–72 hrs. Level 3: 73–108
      hrs. Level 4: 109–144 hrs.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_graduation_can_student_take_extra_courses_en_a9a828:
  - text: 'According to the official FCI student guide Q&A: Yes. Based on the academic advisor''s recommendation, a student
      may register up to 3 additional elective courses (from those offered by the faculty) to improve their cumulative GPA.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_graduation_graduation_project_requirement_year_students_en_993a73:
  - text: 'According to the official FCI student guide Q&A: Fourth-year students must prepare a graduation project on topics
      specified by academic department councils. It spans two semesters, assessed practically and orally by a committee. Evaluation
      coincides with 8th semester exams. The Faculty Council may extend by up to 4 weeks. Students who fail or are absent
      must repeat it.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_graduation_practical_training_required_graduation_en_187817:
  - text: 'According to the official FCI student guide Q&A: Three months of practical training (one month per year) either
      inside or outside the faculty, as per departmental recommendations and Faculty Council approval.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_hybrid_education_system_applied_en_f1694a:
  - text: 'According to the official FCI student guide Q&A: FCI applies a hybrid education system with at least 60% face-to-face
      and 40% distance learning (or any other approved ratio), per Supreme Council of Universities decisions and Faculty Council
      approval.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_graduation_graduation_ceremonies_held_each_academic_en_06c58f:
  - text: 'According to the official FCI student guide Q&A: In June, November, and January of each academic year.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_academic_advisors_their_role_en_234ee4:
  - text: 'According to the official FCI student guide Q&A: Academic advisors are faculty members assigned by the college
      to guide students in choosing the required courses for their degree before the registration period.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_registration_course_registration_begin_each_semester_en_7a9c4b:
  - text: 'According to the official FCI student guide Q&A: One week before the semester starts. Students may also register
      during the first and second weeks after study begins, after paying tuition and obtaining approval from their academic
      advisor and Vice Dean.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_study_system_minimum_credit_hour_load_per_en_01ee12:
  - text: 'According to the official FCI student guide Q&A: 15 credit hours.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_study_system_maximum_credit_hour_load_per_en_8ba205:
  - text: 'According to the official FCI student guide Q&A: 21 credit hours.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_registration_many_courses_can_student_register_en_85d8c0:
  - text: 'According to the official FCI student guide Q&A: Maximum 2 courses (6 credit hours). The Dean may allow up to 3
      courses if: the student has a GPA ≥ 3.7, or if maximum registration would enable graduation that summer, or with Faculty
      Council approval.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_add_drop_many_courses_can_student_add_en_94829e:
  - text: 'According to the official FCI student guide Q&A: Up to 2 courses, during the advising period (1 week before + 2
      weeks after semester start, or 1st week of summer semester). No record appears on the transcript in these cases.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_notation_recorded_student_withdraws_after_en_e9ede9:
  - text: 'According to the official FCI student guide Q&A: A ''W'' (Withdrawn) notation is recorded on the student''s transcript
      for the withdrawn course(s).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_registration_sets_registration_plan_procedures_before_en_b05dcc:
  - text: 'According to the official FCI student guide Q&A: The Vice Dean sets the registration plan and procedures before
      each semester.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_attendance_maximum_allowed_absence_rate_per_en_30c8ab:
  - text: 'According to the official FCI student guide Q&A: 25% of the total teaching hours for the course.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_attendance_consequences_exceeding_absence_rate_en_ce38b7:
  - text: 'According to the official FCI student guide Q&A: The student is considered FAILED in that course and is BARRED
      from the final exam.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_attendance_grade_student_receive_their_excess_en_f12716:
  - text: 'According to the official FCI student guide Q&A: If the absence is due to an excuse accepted by the Faculty Council,
      the student is considered WITHDRAWN and receives a ''W'' grade on their transcript.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_attendance_must_students_they_absent_from_en_fc18e5:
  - text: 'According to the official FCI student guide Q&A: They must report absences to Student Affairs immediately (first-hand,
      as they occur).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_attendance_students_national_patriotic_duties_exempt_en_2b7a8d:
  - text: 'According to the official FCI student guide Q&A: Yes. Absence for national duties is considered excused and does
      not count toward the 25% limit, provided the excuse is approved by the FCI Dean. These students must complete coursework
      in an alternative manner agreed upon with the course instructor.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_exams_exam_arrangement_made_students_national_en_484caa:
  - text: 'According to the official FCI student guide Q&A: They take an alternative exam at the end of the semester covering
      the full course material, graded out of 70%, and lasting 3 hours.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_exams_midterm_exam_held_each_semester_en_f35e57:
  - text: 'According to the official FCI student guide Q&A: At the 7th lecture of each semester (in both main semesters and
      the summer semester), as per the academic calendar.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_exams_final_exam_held_en_e4ac70:
  - text: 'According to the official FCI student guide Q&A: In the last week of each semester, per a schedule issued by the
      Dean''s office. In emergency cases requiring earlier scheduling, the Dean''s approval is required.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_exams_long_each_midterm_final_exam_en_cb4080:
  - text: 'According to the official FCI student guide Q&A: 2 hours each. The Academy''s Scientific Council may modify the
      duration for any course after consulting the Faculty Council and relevant department.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_grading_total_grade_100_distributed_per_en_418384:
  - text: 'According to the official FCI student guide Q&A: Exams: 75% — Midterm: 15%, Final: 60%. Coursework: 25% — including
      oral/written tests, reports and research, lab experiments and field trips, weekly/monthly assignments.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_grading_complete_course_level_grading_scale_en_1f7f09:
  - text: 'According to the official FCI student guide Q&A: A+ (4.0 pts, 95–100%), A (3.7 pts, 90–94%), B+ (3.5 pts, 85–89%),
      B (3.2 pts, 80–84%), C+ (2.9 pts, 73–79%), C (2.6 pts, 65–72%), D+ (2.3 pts, 58–64%), D (2.0 pts, 50–57%), F (0 pts,
      below 50%), ABS (0 pts – Absent), I (Incomplete), W (Withdrawn), AUD (Auditor).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_grading_cumulative_annual_gpa_grading_scale_en_487916:
  - text: 'According to the official FCI student guide Q&A: A (Excellent): 3.7 and above. B (Very Good): 3.2 to less than
      3.7. C (Good): 2.6 to less than 3.2. D (Pass): 2.0 to less than 2.6. F (Fail): below 2.0.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_grading_formula_annual_gpa_en_c84d62:
  - text: 'According to the official FCI student guide Q&A: Annual GPA = Sum of (credit hours × grade points for each course)
      ÷ Total credit hours in the academic year (across both semesters).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_happens_student_fails_mandatory_course_en_f5ebf9:
  - text: 'According to the official FCI student guide Q&A: The student must re-register in that course. Both the fail grade
      and the new grade from re-taking the course are recorded on the transcript (شهادة التقديرات).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_graduation_honors_distinction_requirement_graduation_en_f79579:
  - text: 'According to the official FCI student guide Q&A: A cumulative GPA of at least 3.7 at graduation, provided: 1) The
      student studied at least 75% of graduation requirements at FCI with no failures in any course there. 2) The student
      completed graduation requirements in no more than 4 years (excluding registration suspension periods).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_grading_incomplete_grade_mean_must_resolved_en_2c73df:
  - text: 'According to the official FCI student guide Q&A: It is given when a student misses the exam due to a serious legitimate
      reason accepted by the Faculty Council, and the student''s absence did not exceed the allowed percentage. The student
      must resolve the Incomplete before the start of the next semester, coordinated by the Vice Dean with the course instructor.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_attendance_happens_student_absent_from_final_en_e2138a:
  - text: 'According to the official FCI student guide Q&A: The student is considered FAILED in those courses.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_exams_exam_results_officially_approved_announced_en_265466:
  - text: 'According to the official FCI student guide Q&A: The Faculty Council approves semester exam results. Results are
      not announced until the student has paid all tuition and additional fees.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_electronic_online_examination_allowed_en_31eeaf:
  - text: 'According to the official FCI student guide Q&A: Yes. A hybrid exam system (electronic + traditional) is applied
      per the nature of each course and Supreme Council of Universities decisions. The Faculty Council may decide to conduct
      one or more courses'' exams electronically.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_attendance_grade_student_receive_absent_from_en_2ab96d:
  - text: 'According to the official FCI student guide Q&A: ABS (Absent) = 0 points, counted as FAILED.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_academic_warning_student_receive_academic_warning_en_0c0a99:
  - text: 'According to the official FCI student guide Q&A: When their cumulative GPA falls below 2.0. Their maximum allowed
      credit hours per semester are also reduced to 15.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_academic_warning_long_student_have_clear_academic_en_7ef134:
  - text: 'According to the official FCI student guide Q&A: Two semesters following the warning. The student must raise their
      cumulative GPA to at least 2.00 in this period.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_academic_warning_happens_student_cannot_clear_academic_en_bbfe07:
  - text: 'According to the official FCI student guide Q&A: The student may only re-register in courses they have previously
      failed. For elective courses, they may substitute with an alternative course; if passed, it replaces the original. The
      student has exactly 2 chances to raise their GPA and clear the warning.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_specialization_can_student_academic_warning_change_en_bbb10d:
  - text: 'According to the official FCI student guide Q&A: Yes. A student may transfer to another major within the faculty
      if it improves their chances of clearing the warning, with the Vice Dean for Academic Affairs approving the new study
      plan (excluding incompatible grades and courses).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_registration_registration_suspension_enrollment_freeze_its_en_9f0e62:
  - text: 'According to the official FCI student guide Q&A: A student may suspend registration with Faculty Council approval
      if they submit a compelling reason within 8 weeks of the semester start. All previously earned grades are preserved.
      If submitted after 8 weeks, Academy''s Scientific Council approval is required.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_registration_maximum_total_registration_suspension_allowed_en_80528e:
  - text: 'According to the official FCI student guide Q&A: 2 consecutive semesters OR 4 non-consecutive semesters throughout
      the entire study period.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_graduation_registration_suspension_count_toward_allowed_en_d71489:
  - text: 'According to the official FCI student guide Q&A: No. Suspension periods are NOT counted in the time allowed to
      earn the Bachelor''s degree.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_registration_suspension_happens_student_excuse_suspension_not_en_3f915c:
  - text: 'According to the official FCI student guide Q&A: The student is considered absent. If they are absent for 4 consecutive
      semesters, they are dismissed from the faculty. Otherwise, the interruption period is deducted from the suspension allowance.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_attendance_student_excused_absence_accepted_they_en_8c0ad4:
  - text: 'According to the official FCI student guide Q&A: The absence period is deducted from the suspension allowance.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_discipline_law_governs_student_discipline_en_73fd62:
  - text: 'According to the official FCI student guide Q&A: Universities Organization Law No. 49 of 1972 and its executive
      regulations.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_discipline_actions_considered_disciplinary_violations_en_7e9777:
  - text: 'According to the official FCI student guide Q&A: 1) Disrupting faculty or university order. 2) Obstructing studies
      or inciting others to skip classes. 3) Any act contrary to honor or dignity inside or outside the university. 4) Disrupting
      exam order or cheating. 5) Damaging university facilities, equipment, or books. 6) Organizing unauthorized associations
      within the university. 7) Distributing flyers or wall newspapers without permission. 8) Sit-ins or unauthorized demonstrations.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_exams_happens_student_caught_cheating_during_en_edf605:
  - text: 'According to the official FCI student guide Q&A: The student is immediately removed from the exam room by the Dean
      or their representative, is barred from the remaining exams of that session, is considered FAILED in ALL courses of
      that exam session, and the case is referred to the Disciplinary Council.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_discipline_list_all_disciplinary_penalties_order_en_9c6321:
  - text: 'According to the official FCI student guide Q&A: 1) Oral warning. 2) Written warning. 3) Denial of student services.
      4) Barred from attending specific courses for up to 1 month. 5) Suspended from faculty for up to 1 month. 6) Barred
      from one or more exams. 7) Exam cancelled for one or more courses. 8) Permanent expulsion from the university (reported
      to all Egyptian universities).

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_consequences_permanent_expulsion_from_university_en_4dc824:
  - text: 'According to the official FCI student guide Q&A: The student is barred from enrollment or sitting for exams at
      any Egyptian university. The decision is communicated to all other Egyptian universities.

      Source: FCI_Bilingual_QA_Bank (1).docx'
  utter_fci_qa_guide_disciplinary_decisions_recorded_notified_en_294b69:
  - text: 'According to the official FCI student guide Q&A: All disciplinary decisions (except oral warnings) are kept in
      the student''s file, and the student''s guardian is notified.

      Source: FCI_Bilingual_QA_Bank (1).docx'
